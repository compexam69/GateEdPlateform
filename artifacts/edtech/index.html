    <!--
      Content-Security-Policy (meta tag — belt-and-suspenders fallback).

      The canonical CSP is delivered as an HTTP header by the Vite dev/preview
      server (vite.config.ts `server.headers` / `preview.headers`). That header
      is the enforcement point for frame-ancestors and applies before any HTML
      is parsed.  This meta tag mirrors the same policy for static hosting
      environments that do not set headers, and is ignored for frame-ancestors
      (browsers discard that directive in meta tags per spec).

      Directive notes:
      - script-src: no 'unsafe-inline'; sha256 hashes cover the two inline
        scripts injected by @replit/vite-plugin-runtime-error-modal in dev
        (harmless no-ops in prod where the scripts are absent).
      - style-src: 'unsafe-inline' is required — Framer Motion writes animation
        transforms to element.style at runtime.
      - connect-src: Supabase REST + Realtime WSS; *.backblazeb2.com covers
        regional B2 download subdomains; Sentry ingestion endpoints.
      - worker-src blob: needed for the PWA service worker and PDF.js worker.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self'
        'sha256-L7SfyzTM3npW90hLyjdsYsxVh+bDBqSHkvhPRa2jshQ='
        'sha256-6zo87Fg0XqbKOP1XEwHCmVJ4yfWii/6FiRQsK0hr2d8='
        'sha256-/sitxIYv8ojX1g/MlPBtW5TQExZ+/gm33T4WHn7Vx34='
        'sha256-Z2/iFzh9VMlVkEOar1f/oSHWwQk3ve1qk/C2WdsC4Xk=';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https://*.supabase.co https://*.backblazeb2.com;
      connect-src 'self'
        https://*.supabase.co
        wss://*.supabase.co
        https://*.backblazeb2.com
        https://api.backblazeb2.com
        https://*.ingest.sentry.io
        https://*.sentry.io;
      worker-src 'self' blob:;
      manifest-src 'self';
      form-action 'self';
      base-uri 'self';
      object-src 'none';
    ">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
